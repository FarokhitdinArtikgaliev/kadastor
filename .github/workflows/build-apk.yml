name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # 1. Скачать исходный код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установить Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Установить Java
      # ВАЖНО: cache: gradle здесь НЕ используем,
      # потому что Gradle Wrapper появится только после cap add android
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 4. Установить Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Установить npm-зависимости
      - name: Install dependencies
        run: npm install

      # 6. Проверить Capacitor
      - name: Check Capacitor
        run: npx cap --version

      # 7. Создать Android проект
      - name: Add Android platform
        run: npx cap add android

      # 8. Синхронизировать web-приложение с Android
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. Собрать APK
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 10. Загрузить APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kadastr-Marshrut-v5-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
